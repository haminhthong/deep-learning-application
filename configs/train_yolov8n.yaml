# Training Contract: YOLOv8n PPE Model
experiment_name: train_yolov8n_ppe_v1
model_type: yolov8n.pt
data_config: training/data.yaml
dataset_contract: configs/dataset_v1.yaml

# Core Training Hyperparameters
epochs: 100
batch_size: 16
image_size: 640
seed: 42
device: auto

# Optimizer and Learning Rate Schedule
optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation Policy (Audit for PPE domain)
augmentations:
  hsv_h: 0.015       # Mild hue adjustment (preserve safety vest colors)
  hsv_s: 0.7         # Saturation
  hsv_v: 0.4         # Value / brightness
  degrees: 0.0       # Rotation kept low for upright workers
  translate: 0.1     # Minor translation
  scale: 0.5         # Object scale variance
  fliplr: 0.5        # Horizontal flip
  mosaic: 0.5        # Moderate mosaic to prevent artificial context distortion
